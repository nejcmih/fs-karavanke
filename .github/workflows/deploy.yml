name: Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cpanel-deploy-main
  cancel-in-progress: false

jobs:
  lint-and-deploy:
    name: Lint PHP & Deploy to cPanel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Validate PHP syntax (php -l)
        run: |
          find . -path "./.git" -prune -o -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Deploy to cPanel via FTP/FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          port: ${{ vars.FTP_PORT || 21 }}
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/vendor/**
            .github/**
            .env
            .env.*
            .well-known/**
            cgi-bin/**
            uploads/!(.htaccess)
            uploads/!(.htaccess)/**
            clanki/!(.htaccess)
            clanki/!(.htaccess)/**
            sql/**
            *.sql
            agents.md
            README.md
            error_log
            **/error_log
            **/.DS_Store
            **/_notes/**
