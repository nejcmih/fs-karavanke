name: CI (PHP Syntax Check)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint:
    name: Validate PHP 8.2 Syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Validate PHP syntax (php -l)
        run: |
          find . -path "./.git" -prune -o -name "*.php" -print0 | xargs -0 -n1 php -l
